<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="blazer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f2a1d"/>
      <stop offset="100%" stop-color="#271911"/>
    </linearGradient>
  </defs>
  <!-- Office background -->
  <rect width="120" height="120" fill="url(#bg)"/>
  <rect x="78" y="10" width="32" height="54" rx="2" fill="#f8fafc" opacity="0.55"/>
  <rect x="10" y="14" width="24" height="44" rx="2" fill="#f1f5f9" opacity="0.45"/>

  <!-- Back hair -->
  <path d="M35 46 C34 24, 86 24, 85 46 L88 86 C80 90, 40 90, 32 86 Z" fill="url(#hair)"/>

  <!-- Neck & shoulders -->
  <rect x="51" y="68" width="18" height="20" rx="6" fill="#e8b89a"/>
  <path d="M22 120 C24 92, 42 84, 60 84 C78 84, 96 92, 98 120 Z" fill="url(#blazer)"/>
  <!-- White blouse V-neck -->
  <path d="M47 85 L60 112 L73 85 Z" fill="#ffffff"/>
  <path d="M47 85 L60 112 L53 84 Z" fill="#e2e8f0"/>
  <path d="M73 85 L60 112 L67 84 Z" fill="#e2e8f0"/>

  <!-- Face -->
  <ellipse cx="60" cy="52" rx="19" ry="23" fill="#f2c6aa"/>
  <!-- Cheek shading -->
  <ellipse cx="48" cy="57" rx="4" ry="2.2" fill="#e49b83" opacity="0.38"/>
  <ellipse cx="72" cy="57" rx="4" ry="2.2" fill="#e49b83" opacity="0.38"/>

  <!-- Eyes & eyebrows -->
  <path d="M47 45 Q51.5 43 55 45" stroke="#3f2a1d" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M65 45 Q68.5 43 73 45" stroke="#3f2a1d" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <circle cx="51.5" cy="49.5" r="2.2" fill="#1e293b"/>
  <circle cx="68.5" cy="49.5" r="2.2" fill="#1e293b"/>
  <circle cx="52.2" cy="48.8" r="0.7" fill="#ffffff"/>
  <circle cx="69.2" cy="48.8" r="0.7" fill="#ffffff"/>

  <!-- Nose & warm smile -->
  <path d="M60 51 L59 57 L62 58" stroke="#d59a7a" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M53 63 Q60 68.5 67 63" stroke="#b95a4f" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M54.5 63.5 Q60 67.5 65.5 63.5" stroke="#ffffff" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- Front hair parting -->
  <path d="M40 46 C40 27, 80 26, 80 46 C75 36, 66 34, 58 34 C49 36, 44 40, 40 46 Z" fill="url(#hair)"/>
  <path d="M39 45 C36 58, 37 72, 42 82 C44 70, 44 58, 43 48 Z" fill="url(#hair)"/>
  <path d="M81 45 C84 58, 83 72, 78 82 C76 70, 76 58, 77 48 Z" fill="url(#hair)"/>
</svg>

